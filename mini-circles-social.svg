  <rect width="1200" height="630" fill="#0A3A9C"/>
  <text x="125" y="300" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="170" font-weight="700" letter-spacing="-8">MINI CIRCLES</text>
  <text x="137" y="390" fill="#dbe8ff" font-family="Ubuntu,Arial,sans-serif" font-size="58" font-weight="400">Reading and sport, hand in hand.</text>
  <text x="137" y="490" fill="#FFC929" font-family="Ubuntu,Arial,sans-serif" font-size="42" font-weight="700">READ. PLAY. REPEAT.</text>
</svg>
