<style>

*,*::before,*::after{box-sizing:inherit}

body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--bd)}

button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}

.nav{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:4px;padding-top:12px}
.logo{font:800 1.6rem var(--hd);letter-spacing:-.04em;padding:6px 14px 14px}.logo i{font-style:normal;color:var(--pk)}

.col{background:var(--s);border:1px solid var(--ln);border-radius:22px;overflow:hidden;margin-bottom:14px}

.card h2,.col h2{font:800 1.2rem var(--hd);letter-spacing:-.02em;margin:0 0 6px}.col>h2,.col>p,.col>.fld{margin-left:16px;margin-right:16px}

.av{filter:saturate(.6);flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 .95rem var(--hd);color:#101440}
.p,.cmp{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--ln)}.p:last-child{border-bottom:0}
.pb{min-width:0;flex:1}.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nm{border:0;background:none;padding:0;font-weight:800}.nm:hover{text-decoration:underline}
.vf{background:var(--br);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 8px;font-weight:600}
.p p{margin:4px 0 10px;overflow-wrap:anywhere}
.vid{aspect-ratio:16/9;border-radius:16px;background:var(--br);display:grid;place-items:center;font-size:2.4rem;color:#fff;margin-bottom:10px}
.ev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:2px dashed var(--ln);border-radius:14px;padding:10px;margin-bottom:10px}
.ac{display:flex;gap:4px;flex-wrap:wrap}.ac button{border:0;background:none;color:var(--mu);padding:6px 10px;border-radius:99px;font-weight:600}.ac button:hover{background:var(--bg)}
.ac button[aria-pressed="true"]{color:var(--pk)}
.sh{display:inline-flex;gap:10px;align-items:center;font-weight:600}.sh a{color:var(--br)}
.th{margin-top:8px;border-left:3px solid var(--ln);padding-left:12px}
.cm{display:flex;gap:10px;margin:8px 0}.cm .av{width:32px;height:32px;font-size:.75rem}.cm p{margin:0}
.fld{display:flex;gap:8px;margin:8px 0}.fld input{flex:1;min-width:0}
input,select,textarea{border:2px solid var(--ln);border-radius:14px;padding:9px 12px;background:var(--bg);width:100%}
select option{color:#101440;background:#fff}
textarea{resize:vertical;min-height:64px;margin:8px 0}
.cmp select{width:auto;max-width:100%;margin-right:6px}
.btn{border:0;border-radius:99px;padding:10px 22px;font-weight:600;background:var(--br);color:#fff}
.pill{border:2px solid var(--ln);background:none;border-radius:99px;padding:5px 13px;font-weight:600}
.pill[aria-pressed="true"],.pill.on{background:var(--pk);border-color:var(--pk);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tabs button{flex:1;border:0;background:none;padding:14px;font-weight:600;color:var(--mu)}

.banner{height:110px;background:var(--br)}
.prof{padding:0 16px 16px}.prof .av{width:84px;height:84px;font-size:1.6rem;margin-top:-42px;border:4px solid var(--s)}
.tag{display:inline-block;background:var(--sn);color:#101440;border-radius:8px;padding:2px 9px;font-size:.85rem;font-weight:600;margin:0 6px 6px 0}
.fx{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--ln)}.fx .pill{padding:3px 9px;font-size:.85rem;margin:2px 2px 0 0}
.meter{height:12px;background:var(--ln);border-radius:99px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--sn))}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mu);font-weight:600}
.stat{display:inline-block;margin-right:20px}.stat b{display:block;font:800 1.6rem var(--hd)}
.pg{list-style:none;padding:0;margin:8px 0 0}.pg li{padding:6px 10px;border-radius:10px;background:var(--bg);color:var(--mu);margin-bottom:6px;font-size:.9rem}.pg li.on{background:var(--mn);color:#06301f;font-weight:600}
.hl{outline:3px solid var(--pk)}.nav [data-v="lib"],.nav [data-v="ev"]{display:none}.certp{border:2px solid var(--br);border-radius:16px;padding:22px;text-align:center;margin:12px 0}.certp h2{margin:4px 0}
.crumb{display:flex;align-items:center;gap:2px;border:0;background:none;padding:0;margin-bottom:6px;color:var(--mu);font:600 .85rem var(--bd)}.crumb:hover{color:var(--br)}.crumb svg{width:16px;height:16px}
.hero2{background:var(--s);border:1px solid var(--ln);border-left:4px solid var(--br);border-radius:12px;padding:24px;margin-bottom:16px}.hero2 h2{font:700 1.7rem/1.2 "Source Serif 4",Georgia,serif;margin:0 0 8px}.hero2 p{margin:0 0 14px;color:var(--mu);max-width:56ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.grid2>.card,.grid2>section{margin:0}.grid2>p{grid-column:1/-1;margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}.side{position:sticky;top:84px}
.sfoot{margin:28px 0 12px;padding-top:16px;border-top:1px solid var(--ln);color:var(--mu);font-size:.85rem}
.site .top h1{font:700 1.9rem/1.15 "Source Serif 4",Georgia,serif;letter-spacing:-.01em}
.site .card,.site .col{border-radius:12px}.site .banner{height:150px}.site .col h2,.site .card h2{font:700 1.15rem var(--hd)}
.ac button[aria-pressed="true"] svg{fill:currentColor}
@media (min-width:921px){.site .app{grid-template-columns:190px minmax(0,920px)}.site .rail{display:none}}
@media (max-width:760px){.two{grid-template-columns:1fr}.side{position:static}}
@media print{body *{visibility:hidden}.certp,.certp *{visibility:visible}.certp{position:absolute;left:0;top:0;width:100%}}.pinned{padding:14px 16px;background:var(--br);color:#fff}.pinned p{margin:6px 0 0}.pinned .vf{background:#fff;color:var(--br)}h3{font:800 1rem var(--hd)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#101440;color:var(--mn);padding:10px 18px;border-radius:99px;z-index:40;max-width:90vw;text-align:center}#toast:empty{display:none}
@media (max-width:920px){
.app{grid-template-columns:minmax(0,1fr);gap:0}.rail{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;justify-content:space-around;background:var(--s);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:25;gap:0}
.nav .logo{display:none}.nav button{flex-direction:column;gap:0;padding:6px 4px;font-size:.68rem;border-radius:12px;flex:1;align-items:center}.nav button span.ic{font-size:1.25rem}.bd{position:absolute;top:0;right:6px;margin:0}
.mid{padding-bottom:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
